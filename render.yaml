services:
  - type: web
    name: ai-powered
    runtime: node
    region: oregon
    plan: 1c-2g
    branch: main
    buildCommand: npm ci && npm run build && npm run build:web && npm run build:dist
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production

      - key: AI_PROVIDER
        value: openai

      - key: AI_MODEL
        value: gpt-4o

      - key: CORS_ORIGIN
        sync: false

      - key: PROXY_PUBLIC_BASE_URL
        value: https://ai-powered.onrender.com

      - key: OPENAI_API_KEY
        sync: false
