services:
  - type: web
    name: ai-powered-proxy
    region: oregon
    plan: 1c-2g
    branch: main
    buildCommand: npm ci && npm run build && npm run build:web
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production

      # Startup defaults only; browser proxy requests can still override provider/model per tab.
      - key: AI_PROVIDER
        value: openai

      - key: AI_MODEL
        value: gpt-4o

      - key: CORS_ORIGIN
        sync: false

      - key: PROXY_PUBLIC_BASE_URL
        value: https://ai-powered.onrender.com

      - key: OPENAI_API_KEY
        sync: false

      - key: OPENROUTER_API_KEY
        sync: false

      - key: ANTHROPIC_API_KEY
        sync: false

      - key: XAI_API_KEY
        sync: false

      - key: VENICE_API_KEY
        sync: false

      - key: LUMAAI_API_KEY
        sync: false

      - key: RUNWAYML_API_SECRET
        sync: false

      - key: PIKA_API_KEY
        sync: false

      - key: VIBEVOICE_API_URL
        sync: false
